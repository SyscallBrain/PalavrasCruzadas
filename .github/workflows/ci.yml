name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install hunspell (pt-PT)
        run: sudo apt-get update && sudo apt-get install -y hunspell hunspell-pt-pt

      - name: Validate the clue bank
        run: |
          python3 tools/validate_clues.py
          python3 tools/check_spelling.py --require
          python3 -m unittest discover -s tools/tests

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:test :levelgen:test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/
            core/build/reports/tests/
            levelgen/build/reports/tests/
