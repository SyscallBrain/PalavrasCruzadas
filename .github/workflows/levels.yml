name: Levels

# Regenerates the campaign, the daily puzzles and the books (~40 min) and compares them with the
# committed assets. Only runs when something that feeds the generator changes.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "core/src/main/**"
      - "levelgen/**"
      - "app/src/main/assets/**"
      - ".github/workflows/levels.yml"
  pull_request:
    paths:
      - "content/**"
      - "core/src/main/**"
      - "levelgen/**"
      - "app/src/main/assets/**"
  workflow_dispatch:

concurrency:
  group: levels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: gradle/actions/setup-gradle@v4

      - name: Levels match the committed assets
        run: ./gradlew :levelgen:run --args="--check"
